name: Desktop CI on request

# Pull requests run the desktop checks only when they touch the desktop app.
# Adding the `desktop-ci` label runs them now for the pull request's head; the
# shared classifier also reads the label, so later pushes keep running them.
# The desktop workflows themselves do not listen for `labeled`: their per-PR
# concurrency groups would let any unrelated label change cancel a real run.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  dispatch:
    name: Run desktop checks for this pull request
    # Dispatching needs a write token, which pull requests from forks never get.
    if: >-
      github.event.label.name == 'desktop-ci'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the desktop workflows on the pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          for workflow in desktop-release-guard.yml desktop-connect-discovery-guard.yml; do
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
            echo "Dispatched $workflow on $HEAD_REF" >> "$GITHUB_STEP_SUMMARY"
          done
